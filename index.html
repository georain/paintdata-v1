<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintData</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <style>
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --surface-hover: #f0f0f2;
            --border: #e5e5e7;
            --text: #1a1a1a;
            --text-secondary: #6b6b70;
            --text-tertiary: #9a9a9f;
            --accent: #1a1a1a;
            --accent-text: #ffffff;
            --bubble-bg: #f0f0f2;
            --bubble-text: #1a1a1a;
            --user-bubble-bg: #1a1a1a;
            --user-bubble-text: #ffffff;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --toggle-bg: #e5e5e7;
            --toggle-active: #1a1a1a;
        }
        [data-theme="dark"] {
            --bg: #121214;
            --surface: #1c1c1f;
            --surface-hover: #2a2a2e;
            --border: #2e2e32;
            --text: #f0f0f2;
            --text-secondary: #a0a0a6;
            --text-tertiary: #6a6a70;
            --accent: #f0f0f2;
            --accent-text: #1a1a1a;
            --bubble-bg: #2a2a2e;
            --bubble-text: #f0f0f2;
            --user-bubble-bg: #f0f0f2;
            --user-bubble-text: #1a1a1a;
            --toggle-bg: #2e2e32;
            --toggle-active: #f0f0f2;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
            transition: background 0.4s ease;
        }
        .login-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.6s cubic-bezier(0.4,0,0.2,1), transform 0.6s cubic-bezier(0.4,0,0.2,1);
        }
        .login-screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.08); }
        .login-card {
            width: 90%;
            max-width: 380px;
            padding: 32px 28px;
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1), background 0.4s ease;
        }
        .login-logo {
            width: 60px; height: 60px; border-radius: 16px; background: var(--accent);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
        }
        .login-logo svg { width: 30px; height: 30px; fill: none; stroke: var(--accent-text); stroke-width: 1.5; }
        .login-card h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; color: var(--text); }
        .login-card p { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 20px; }
        .login-card input {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg); font-size: 0.85rem; color: var(--text); outline: none; margin-bottom: 12px;
        }
        .login-card button {
            width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--accent);
            color: var(--accent-text); font-size: 0.9rem; font-weight: 600; cursor: pointer;
        }
        .login-error { font-size: 0.72rem; color: #ff3b30; margin-top: 8px; min-height: 18px; }
        .app-container {
            width: 100%; max-width: 1000px; height: 92vh; display: flex; gap: 12px;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s cubic-bezier(0.4,0,0.2,1), transform 0.6s cubic-bezier(0.4,0,0.2,1);
        }
        .app-container.visible { opacity: 1; transform: translateY(0); }
        .sidebar {
            width: 0; overflow: hidden; flex-shrink: 0; background: var(--surface);
            border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow);
            transition: width 0.35s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column;
        }
        .sidebar.open { width: 240px; padding: 14px; }
        .sidebar-content { display: flex; flex-direction: column; gap: 10px; opacity: 0; min-width: 210px; flex: 1; overflow-y: auto; }
        .sidebar.open .sidebar-content { opacity: 1; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px; }
        .sidebar-title { font-size: 1rem; font-weight: 600; color: var(--text); }
        .close-sidebar-btn {
            width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border);
            background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .close-sidebar-btn svg { width: 14px; height: 14px; fill: none; stroke: var(--text-secondary); stroke-width: 1.5; }
        .new-chat-btn {
            padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface-hover); color: var(--text); cursor: pointer; font-size: 0.82rem; font-weight: 500;
        }
        .chat-list { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .chat-item {
            padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 0.78rem;
            color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between;
        }
        .chat-item.active { background: var(--accent); color: var(--accent-text); }
        .chat-item .del-btn { opacity: 0; background: none; border: none; color: inherit; cursor: pointer; font-size: 0.7rem; }
        .chat-item:hover .del-btn { opacity: 0.6; }
        .main-area { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .header-bar {
            padding: 12px 16px; background: var(--surface); border-radius: var(--radius);
            border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px;
        }
        .menu-btn {
            width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
            background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .menu-btn svg { width: 16px; height: 16px; fill: none; stroke: var(--text); stroke-width: 1.5; }
        .header-title { font-size: 0.95rem; font-weight: 600; color: var(--text); }
        .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .theme-btn {
            width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
            background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .theme-btn svg { width: 15px; height: 15px; fill: none; stroke: var(--text); stroke-width: 1.5; }
        .model-switch-btn {
            padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: none; cursor: pointer; color: var(--text-secondary); font-size: 0.75rem;
        }
        .model-switch-btn.active { background: var(--accent); color: var(--accent-text); border-color: transparent; }
        .messages-container {
            flex: 1; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: var(--shadow); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
        }
        .message { display: flex; align-items: flex-start; gap: 8px; }
        .message.user { flex-direction: row-reverse; }
        .msg-avatar {
            width: 28px; height: 28px; border-radius: 8px; background: var(--surface-hover);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; font-weight: 600; color: var(--text-secondary); flex-shrink: 0;
        }
        .msg-avatar svg { width: 15px; height: 15px; fill: none; stroke: var(--text); stroke-width: 1.5; }
        .msg-bubble {
            padding: 9px 13px; border-radius: 12px 12px 12px 4px; background: var(--bubble-bg);
            font-size: 0.85rem; line-height: 1.6; max-width: 75%; color: var(--bubble-text); word-break: break-word;
        }
        .message.user .msg-bubble { border-radius: 12px 12px 4px 12px; background: var(--user-bubble-bg); color: var(--user-bubble-text); }
        .msg-status {
            font-size: 0.65rem; color: var(--text-tertiary); padding: 2px 4px; border-radius: 4px;
            background: var(--surface-hover); display: inline-block; margin-bottom: 4px;
        }
        .typing-cursor { display:inline-block; width:2px; height:1em; background:var(--accent); margin-left:2px; animation:blink 0.8s infinite; vertical-align:text-bottom; }
        @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
        .input-area {
            background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: var(--shadow); padding: 8px 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
        }
        .input-field {
            flex: 1; min-width: 150px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--bg); font-size: 0.85rem; color: var(--text); outline: none;
        }
        .input-actions { display: flex; gap: 4px; align-items: center; }
        .toggle-item { display: flex; align-items: center; gap: 3px; font-size: 0.65rem; color: var(--text-secondary); cursor: pointer; user-select: none; }
        .toggle-switch {
            width: 26px; height: 14px; border-radius: 7px; background: var(--toggle-bg);
            position: relative; transition: background 0.2s ease;
        }
        .toggle-switch.active { background: var(--toggle-active); }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
            border-radius: 50%; background: #fff; transition: left 0.2s ease;
        }
        .toggle-switch.active::after { left: 14px; }
        .send-btn {
            width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--accent);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .send-btn svg { width: 14px; height: 14px; fill: none; stroke: var(--accent-text); stroke-width: 1.8; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .modal-overlay.active { opacity:1; pointer-events:auto; }
        .modal {
            width: 90%; max-width: 380px; padding: 22px; background: var(--surface);
            border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow);
        }
        .modal h2 { font-size: 1rem; margin-bottom: 10px; color: var(--text); }
        .modal input {
            width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); font-size: 0.8rem; color: var(--text); outline: none; margin-bottom: 10px;
        }
        .modal-buttons { display: flex; gap: 6px; justify-content: flex-end; }
        .modal-btn {
            padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
            background: none; cursor: pointer; font-size: 0.78rem; color: var(--text);
        }
        .modal-btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <div class="login-logo">
            <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><line x1="6" y1="6" x2="18" y2="6"/><line x1="6" y1="6" x2="12" y2="18"/><line x1="18" y1="6" x2="12" y2="18"/></svg>
        </div>
        <h1>PaintData</h1>
        <p>输入GLMAI API密钥以验证并登录（可在GLM开放平台获取）</p>
        <input type="password" id="loginApiKey" placeholder="智谱AI API密钥" autocomplete="off">
        <button id="loginBtn">验证并登录</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<div class="app-container" id="appContainer">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="sidebar-header">
                <span class="sidebar-title">对话</span>
                <button class="close-sidebar-btn" id="closeSidebarBtn">
                    <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                </button>
            </div>
            <button class="new-chat-btn" id="newChatBtn">新对话</button>
            <div class="chat-list" id="chatList"></div>
        </div>
    </div>
    <div class="main-area">
        <div class="header-bar">
            <button class="menu-btn" id="menuBtn">
                <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            </button>
            <span class="header-title">PaintData</span>
            <div class="header-right">
                <button class="model-switch-btn active" data-model="self" id="selfModelBtn">自研</button>
                <button class="model-switch-btn" data-model="glm" id="glmModelBtn">智谱</button>
                <button class="theme-btn" id="themeToggle">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.5" y1="4.5" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19.5" y2="19.5"/><line x1="4.5" y1="19.5" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19.5" y2="4.5"/></svg>
                </button>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer">
            <div style="text-align:center;color:var(--text-tertiary);font-size:0.8rem;">开始新的对话</div>
        </div>
        <div class="input-area">
            <input type="text" class="input-field" id="userInput" placeholder="输入内容" autocomplete="off">
            <div class="input-actions">
                <div class="toggle-item" id="deepThinkToggle">
                    <span>深度</span>
                    <div class="toggle-switch" id="deepThinkSwitch"></div>
                </div>
                <div class="toggle-item" id="webSearchToggle">
                    <span>联网</span>
                    <div class="toggle-switch" id="webSearchSwitch"></div>
                </div>
                <button class="send-btn" id="sendBtn">
                    <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="apiKeyModal">
    <div class="modal">
        <h2>配置智谱AI API密钥</h2>
        <input type="password" id="modalApiKeyInput" placeholder="请输入API密钥">
        <div class="modal-buttons">
            <button class="modal-btn" id="cancelKeyBtn">取消</button>
            <button class="modal-btn primary" id="confirmKeyBtn">确认</button>
        </div>
    </div>
</div>

<script>
(function() {
    const ZHIPU_API_URL = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
    const DEEP_THINK_MODEL = 'glm-4-plus';
    const WEB_SEARCH_MODEL = 'glm-4-flash';
    
    let apiKey = '';
    let selectedModel = 'self';
    let deepThinkEnabled = false;
    let webSearchEnabled = false;
    let isProcessing = false;
    let currentChatId = null;
    let chats = {};
    
    try {
        apiKey = localStorage.getItem('paintdata_api_key') || '';
        const saved = localStorage.getItem('paintdata_chats');
        if (saved) chats = JSON.parse(saved);
    } catch(e) { apiKey=''; chats={}; }
    
    if (Object.keys(chats).length === 0) {
        const id = 'chat_' + Date.now();
        chats[id] = { title: '对话 1', messages: [] };
        currentChatId = id;
    }
    
    let qaDatabase = {};
    try {
        const c = document.cookie.split('; ').find(r => r.startsWith('paintdata_qa='));
        if (c) qaDatabase = JSON.parse(decodeURIComponent(c.split('=')[1]));
    } catch(e) { qaDatabase = {}; }
    
    const keywordResponses = {
        '你好': '你好！很高兴见到你。',
        '在吗': '在的，我一直都在。',
        '早安': '早安！祝你今天心情愉快。',
        '晚安': '晚安，做个好梦。',
        '谢谢': '不客气。',
        '再见': '再见。',
        '天气': '今天天气应该不错。',
        '学习': '学习是一个持续的过程。',
        '人工': '人工智能正在改变世界。',
        '数据': '数据是新时代的石油。',
        '算法': '算法是解决问题的步骤。',
        '模型': '模型需要大量数据训练。',
        '语言': '语言是人类交流的工具。',
        '知识': '知识就是力量。',
        '实践': '实践出真知。',
        '思考': '思考让人成长。',
        '沟通': '沟通是理解的桥梁。',
        '帮助': '我很乐意帮助你。',
        '面包': '做面包的基本步骤：1. 准备面粉、酵母、水、盐。2. 揉面。3. 发酵。4. 整形。5. 烤箱180度烤25分钟。',
        '怎么做': '告诉我你想做什么。',
        '怎么办': '别着急，一步步来。'
    };
    
    function saveChats() { try { localStorage.setItem('paintdata_chats', JSON.stringify(chats)); } catch(e){} }
    function saveQA(q,a) { try { qaDatabase[q]=a; document.cookie='paintdata_qa='+encodeURIComponent(JSON.stringify(qaDatabase))+'; max-age=2592000; path=/'; } catch(e){} }
    
    const loginScreen = document.getElementById('loginScreen');
    const appContainer = document.getElementById('appContainer');
    const loginApiKey = document.getElementById('loginApiKey');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menuBtn');
    const closeSidebarBtn = document.getElementById('closeSidebarBtn');
    const themeToggle = document.getElementById('themeToggle');
    const newChatBtn = document.getElementById('newChatBtn');
    const chatList = document.getElementById('chatList');
    const messagesContainer = document.getElementById('messagesContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const selfModelBtn = document.getElementById('selfModelBtn');
    const glmModelBtn = document.getElementById('glmModelBtn');
    const deepThinkToggle = document.getElementById('deepThinkToggle');
    const deepThinkSwitch = document.getElementById('deepThinkSwitch');
    const webSearchToggle = document.getElementById('webSearchToggle');
    const webSearchSwitch = document.getElementById('webSearchSwitch');
    const apiKeyModal = document.getElementById('apiKeyModal');
    const modalApiKeyInput = document.getElementById('modalApiKeyInput');
    const cancelKeyBtn = document.getElementById('cancelKeyBtn');
    const confirmKeyBtn = document.getElementById('confirmKeyBtn');
    
    function renderMarkdown(t) { return marked.parse(t); }
    function updateTheme() { document.documentElement.setAttribute('data-theme', localStorage.getItem('paintdata_theme') || 'light'); }
    function toggleTheme() { const cur = document.documentElement.getAttribute('data-theme') || 'light'; const next = cur === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', next); localStorage.setItem('paintdata_theme', next); }
    
    function renderChatList() {
        chatList.innerHTML = '';
        for (const id of Object.keys(chats)) {
            const item = document.createElement('div');
            item.className = 'chat-item' + (id === currentChatId ? ' active' : '');
            const span = document.createElement('span');
            span.textContent = chats[id].title || '对话';
            const del = document.createElement('button');
            del.className = 'del-btn';
            del.textContent = 'x';
            del.addEventListener('click', function(e) {
                e.stopPropagation();
                if (Object.keys(chats).length <= 1) return;
                delete chats[id];
                if (id === currentChatId) currentChatId = Object.keys(chats)[0];
                saveChats(); renderChatList(); renderMessages();
            });
            item.appendChild(span); item.appendChild(del);
            item.addEventListener('click', function() { currentChatId = id; renderChatList(); renderMessages(); });
            chatList.appendChild(item);
        }
    }
    
    function renderMessages() {
        messagesContainer.innerHTML = '';
        if (!currentChatId || !chats[currentChatId]) return;
        const msgs = chats[currentChatId].messages || [];
        if (msgs.length === 0) {
            messagesContainer.innerHTML = '<div style="text-align:center;color:var(--text-tertiary);font-size:0.8rem;">开始新的对话</div>';
            return;
        }
        for (const m of msgs) {
            const div = document.createElement('div');
            div.className = 'message ' + m.sender;
            const av = document.createElement('div');
            av.className = 'msg-avatar';
            if (m.sender === 'assistant') av.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><line x1="6" y1="6" x2="18" y2="6"/><line x1="6" y1="6" x2="12" y2="18"/><line x1="18" y1="6" x2="12" y2="18"/></svg>';
            else av.textContent = 'YOU';
            const bub = document.createElement('div');
            bub.className = 'msg-bubble';
            if (m.status) {
                const statusEl = document.createElement('div');
                statusEl.className = 'msg-status';
                statusEl.textContent = m.status;
                bub.appendChild(statusEl);
            }
            const contentEl = document.createElement('div');
            contentEl.innerHTML = m.sender === 'assistant' ? renderMarkdown(m.content) : m.content;
            bub.appendChild(contentEl);
            div.appendChild(av); div.appendChild(bub);
            messagesContainer.appendChild(div);
        }
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function addMessage(content, sender, status) {
        if (!currentChatId || !chats[currentChatId]) return;
        chats[currentChatId].messages.push({ sender, content, status: status || '' });
        if (chats[currentChatId].messages.length === 2 && sender === 'assistant') chats[currentChatId].title = content.slice(0, 15) + '...';
        saveChats(); renderMessages(); renderChatList();
    }
    
    function typeText(bubble, content, status, callback) {
        const displayText = renderMarkdown(content);
        const cursor = document.createElement('span');
        cursor.className = 'typing-cursor';
        bubble.appendChild(cursor);
        let charIndex = 0;
        const totalChars = content.length;
        const speed = totalChars > 100 ? 6 : 12;
        function typeNextChar() {
            if (charIndex < totalChars) {
                bubble.innerHTML = '';
                if (status) {
                    const statusEl = document.createElement('div');
                    statusEl.className = 'msg-status';
                    statusEl.textContent = status;
                    bubble.appendChild(statusEl);
                }
                const contentEl = document.createElement('div');
                contentEl.innerHTML = renderMarkdown(content.slice(0, charIndex + 1));
                bubble.appendChild(contentEl);
                bubble.appendChild(cursor);
                if (window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise([bubble]).catch(function(){});
                }
                charIndex++;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                setTimeout(typeNextChar, speed);
            } else {
                cursor.remove();
                bubble.innerHTML = '';
                if (status) {
                    const statusEl = document.createElement('div');
                    statusEl.className = 'msg-status';
                    statusEl.textContent = status;
                    bubble.appendChild(statusEl);
                }
                const contentEl = document.createElement('div');
                contentEl.innerHTML = displayText;
                bubble.appendChild(contentEl);
                if (window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise([bubble]).catch(function(){});
                }
                if (callback) callback();
            }
        }
        typeNextChar();
    }
    
    function addMessageWithTyping(content, sender, status) {
        if (!currentChatId || !chats[currentChatId]) return;
        chats[currentChatId].messages.push({ sender, content, status: status || '' });
        if (chats[currentChatId].messages.length === 2 && sender === 'assistant') chats[currentChatId].title = content.slice(0, 15) + '...';
        saveChats();
        renderChatList();
        renderMessages();
        
        const lastMsg = messagesContainer.lastElementChild;
        if (lastMsg && sender === 'assistant') {
            const bubble = lastMsg.querySelector('.msg-bubble');
            if (bubble) {
                typeText(bubble, content, status, null);
            }
        }
    }
    
    function selfAIResponse(q) {
        if (qaDatabase[q]) return qaDatabase[q];
        const keys = Object.keys(keywordResponses).sort((a,b)=>b.length-a.length);
        for (const k of keys) if (q.includes(k)) return keywordResponses[k];
        return null;
    }
    
    async function callZhipu(q, ctx, modelName) {
        if (!apiKey) throw new Error('no key');
        const systemPrompt = webSearchEnabled 
            ? '你是PaintData，请结合联网搜索的结果回答用户问题。'
            : '你是PaintData，请用中文准确回答。';
        const resp = await fetch(ZHIPU_API_URL, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                model: modelName, 
                messages: [{role:'system',content:systemPrompt},...ctx.slice(-6),{role:'user',content:q}], 
                temperature: 0.7, 
                max_tokens: 1024 
            })
        });
        if (!resp.ok) throw new Error('fail');
        const data = await resp.json();
        return data.choices[0].message.content;
    }
    
    async function verifyKey(key) {
        try {
            const resp = await fetch(ZHIPU_API_URL, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: 'glm-4-flash', messages: [{role:'user',content:'ping'}], max_tokens: 3 })
            });
            return resp.ok;
        } catch(e) { return false; }
    }
    
    loginBtn.addEventListener('click', async function() {
        const key = loginApiKey.value.trim();
        if (!key) { loginError.textContent = '请输入API密钥(均使用免费模型)'; return; }
        loginBtn.disabled = true; loginBtn.textContent = '验证中...';
        const ok = await verifyKey(key);
        if (ok) {
            apiKey = key;
            try { localStorage.setItem('paintdata_api_key', apiKey); } catch(e){}
            loginScreen.classList.add('hidden');
            appContainer.classList.add('visible');
            renderChatList(); renderMessages();
        } else {
            loginError.textContent = '验证失败，请检查API密钥';
        }
        loginBtn.disabled = false; loginBtn.textContent = '验证并登录';
    });
    
    menuBtn.addEventListener('click', function() { sidebar.classList.toggle('open'); });
    closeSidebarBtn.addEventListener('click', function() { sidebar.classList.remove('open'); });
    themeToggle.addEventListener('click', toggleTheme);
    
    newChatBtn.addEventListener('click', function() {
        const id = 'chat_' + Date.now();
        chats[id] = { title: '新对话', messages: [] };
        currentChatId = id;
        saveChats(); renderChatList(); renderMessages();
    });
    
    selfModelBtn.addEventListener('click', function() {
        selectedModel = 'self';
        selfModelBtn.classList.add('active');
        glmModelBtn.classList.remove('active');
    });
    
    glmModelBtn.addEventListener('click', function() {
        selectedModel = 'glm';
        glmModelBtn.classList.add('active');
        selfModelBtn.classList.remove('active');
        if (!apiKey) { apiKeyModal.classList.add('active'); }
    });
    
    deepThinkToggle.addEventListener('click', function() {
        deepThinkEnabled = !deepThinkEnabled;
        deepThinkSwitch.classList.toggle('active', deepThinkEnabled);
    });
    
    webSearchToggle.addEventListener('click', function() {
        webSearchEnabled = !webSearchEnabled;
        webSearchSwitch.classList.toggle('active', webSearchEnabled);
    });
    
    cancelKeyBtn.addEventListener('click', function() { apiKeyModal.classList.remove('active'); });
    confirmKeyBtn.addEventListener('click', function() {
        const key = modalApiKeyInput.value.trim();
        if (!key) return;
        apiKey = key;
        try { localStorage.setItem('paintdata_api_key', apiKey); } catch(e){}
        apiKeyModal.classList.remove('active');
    });
    
    function handleSend() {
        if (isProcessing) return;
        const text = userInput.value.trim();
        if (!text) return;
        userInput.value = '';
        addMessage(text, 'user');
        const ctx = (chats[currentChatId]?.messages || []).map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.content }));
        isProcessing = true; sendBtn.disabled = true;
        
        let statusText = '';
        if (deepThinkEnabled) statusText += '深度思考 ';
        if (webSearchEnabled) statusText += '联网搜索';
        if (!statusText) statusText = '';
        
        setTimeout(async function() {
            let response;
            let modelName = 'glm-4-flash';
            if (deepThinkEnabled) modelName = DEEP_THINK_MODEL;
            if (webSearchEnabled) modelName = WEB_SEARCH_MODEL;
            
            if (selectedModel === 'glm' || deepThinkEnabled || webSearchEnabled) {
                if (!apiKey) {
                    apiKeyModal.classList.add('active');
                    isProcessing = false; sendBtn.disabled = false;
                    return;
                }
                try {
                    response = await callZhipu(text, ctx, modelName);
                    saveQA(text, response);
                } catch(e) {
                    response = '抱歉，智谱API调用失败。';
                }
            } else {
                const local = selfAIResponse(text);
                if (local) {
                    response = local;
                } else if (apiKey) {
                    try {
                        response = await callZhipu(text, ctx, modelName);
                        saveQA(text, response);
                    } catch(e) {
                        response = '抱歉，暂时无法回答。';
                    }
                } else {
                    response = '你可以具体说说想了解什么。';
                }
            }
            
            addMessageWithTyping(response, 'assistant', statusText);
            isProcessing = false; sendBtn.disabled = false;
        }, 80);
    }
    
    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); handleSend(); } });
    
    updateTheme();
    if (apiKey) {
        loginScreen.classList.add('hidden');
        appContainer.classList.add('visible');
        renderChatList(); renderMessages();
    }
})();
</script>
